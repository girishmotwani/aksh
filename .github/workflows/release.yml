name: Release images

# Builds and publishes the two production images -- aksh-proxy and aksh-injector --
# to GitHub Container Registry (GHCR). Until this existed there was no supported
# way for a cluster to *pull* aksh: the Dockerfiles under build/ were only ever
# built locally and `kind load`-ed by the e2e harness (issue #63).
#
# Publish triggers:
#   * a semver tag push (v1.2.3)      -> :1.2.3, :1.2, :sha-<short>, and :latest
#   * manual workflow_dispatch        -> :edge and :sha-<short> (no :latest)
# Pull-request and branch pushes do NOT publish; they build only, so a broken
# Dockerfile is still caught by CI without minting an image.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "build/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: build and publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only the publishing steps need write; guarded by `if: github.event_name != 'pull_request'`.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aksh-proxy
            dockerfile: build/proxy.Dockerfile
          - image: aksh-injector
            dockerfile: build/injector.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Compute tags/labels. On a semver tag we also move :latest; a manual run
      # only publishes :edge so it can never silently become the default image.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      # No login on pull_request: those runs build only, to validate the Dockerfile.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
