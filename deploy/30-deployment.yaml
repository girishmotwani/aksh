apiVersion: apps/v1
kind: Deployment
metadata:
  name: aksh-injector
  namespace: aksh-system
  labels:
    app.kubernetes.io/name: aksh-injector
    app.kubernetes.io/part-of: aksh
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aksh-injector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aksh-injector
    spec:
      serviceAccountName: aksh-injector
      containers:
        - name: aksh-injector
          image: aksh-injector:latest
          # For kind e2e the image is side-loaded, so pull is skipped. Production
          # deployments should pin an immutable tag or digest instead of :latest.
          imagePullPolicy: IfNotPresent
          args:
            - "-addr=:9443"
            - "-metrics-addr=:9464"
            - "-service-name=aksh-injector"
            - "-service-namespace=aksh-system"
            - "-mutating-webhook-configuration=aksh-injector-mutating"
            - "-validating-webhook-configuration=aksh-injector-validating"
          env:
            - name: AKSH_INJECTOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: https
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
