apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aksh-injector.fullname" . }}
  namespace: {{ include "aksh-injector.namespace" . }}
  labels:
    {{- include "aksh-injector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.injector.replicas }}
  selector:
    matchLabels:
      {{- include "aksh-injector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aksh-injector.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aksh-injector.fullname" . }}
      containers:
        - name: aksh-injector
          image: {{ include "aksh-injector.image" . | quote }}
          imagePullPolicy: {{ .Values.injector.image.pullPolicy }}
          args:
            - "-addr=:{{ .Values.injector.listenPort }}"
            - "-metrics-addr=:{{ .Values.injector.metricsPort }}"
            - "-service-name={{ include "aksh-injector.fullname" . }}"
            - "-service-namespace={{ include "aksh-injector.namespace" . }}"
            - "-mutating-webhook-configuration={{ .Values.webhook.mutatingConfigName }}"
            - "-validating-webhook-configuration={{ .Values.webhook.validatingConfigName }}"
            - "-cabundle-patch-interval={{ .Values.injector.cabundlePatchInterval }}"
            # The sidecar image injected into workload pods.
            - "-proxy-image={{ .Values.proxyImage }}"
          env:
            - name: AKSH_INJECTOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.runtimeProfile.entra.tenantId }}
            - name: AKSH_INJECTOR_ENTRA_TENANT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtimeProfile.entra.clientId }}
            - name: AKSH_INJECTOR_ENTRA_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtimeProfile.entra.authority }}
            - name: AKSH_INJECTOR_ENTRA_AUTHORITY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtimeProfile.cgroup.hostMount }}
            - name: AKSH_INJECTOR_HOST_CGROUP_MOUNT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtimeProfile.cgroup.localMount }}
            - name: AKSH_INJECTOR_LOCAL_CGROUP_MOUNT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtimeProfile.capture.dnsServer }}
            - name: AKSH_INJECTOR_CAPTURE_DNS_SERVER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtimeProfile.capture.bypassCidrs }}
            - name: AKSH_INJECTOR_CAPTURE_BYPASS_CIDRS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtimeProfile.ca.secretName }}
            - name: AKSH_INJECTOR_CA_SECRET_NAME
              value: {{ . | quote }}
            - name: AKSH_INJECTOR_CA_CERT_KEY
              value: {{ $.Values.runtimeProfile.ca.certKey | quote }}
            - name: AKSH_INJECTOR_CA_PRIVATE_KEY_KEY
              value: {{ $.Values.runtimeProfile.ca.privateKeyKey | quote }}
            - name: AKSH_INJECTOR_CA_PUBLIC_CERT_KEY
              value: {{ $.Values.runtimeProfile.ca.publicCertKey | quote }}
            {{- end }}
            {{- with .Values.runtimeProfile.staticToken.secretName }}
            - name: AKSH_INJECTOR_STATIC_TOKEN_SECRET_NAME
              value: {{ . | quote }}
            - name: AKSH_INJECTOR_STATIC_TOKEN_SECRET_KEY
              value: {{ $.Values.runtimeProfile.staticToken.secretKey | quote }}
            {{- end }}
            - name: AKSH_INJECTOR_POD_ATTRIBUTION
              value: {{ .Values.runtimeProfile.podAttribution | quote }}
          ports:
            - name: https
              containerPort: {{ .Values.injector.listenPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.injector.metricsPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.injector.listenPort }}
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.injector.listenPort }}
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.injector.resources | nindent 12 }}
