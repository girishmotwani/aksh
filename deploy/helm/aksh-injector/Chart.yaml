apiVersion: v2
name: aksh-injector
description: >-
  aksh egress-proxy sidecar injector — a Kubernetes admission webhook that
  transparently injects the aksh-proxy egress-enforcement sidecar into pods in
  opted-in namespaces (label aksh.dev/inject=enabled) and rejects pods shaped to
  defeat enforcement (INV-10). Fail-closed by design.
type: application
# Chart version — bump on chart changes.
version: 0.1.0
# The aksh version this chart deploys by default (see values.yaml image tags).
appVersion: "0.1.0"
keywords:
  - aksh
  - egress
  - admission-webhook
  - sidecar-injection
  - security
home: https://github.com/girishmotwani/aksh
sources:
  - https://github.com/girishmotwani/aksh
