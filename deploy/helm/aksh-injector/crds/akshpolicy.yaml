# AkshPolicy CRD (aksh.dev/v1alpha1), authored from api/v1alpha1/types.go.
#
# The spec uses x-kubernetes-preserve-unknown-fields so the schema stays in
# lockstep with the Go types without hand-maintaining every nested field; the
# top-level shape (spec.egress.rules[]) is still validated.
#
# This file is shipped in two places and the two copies must stay byte-identical
# (CI enforces it, because Helm cannot template a file under crds/):
#
#   deploy/05-crd.yaml                              -- the raw-manifest path
#   deploy/helm/aksh-injector/crds/akshpolicy.yaml  -- the Helm path
#
# Helm installs everything under crds/ automatically on `helm install`, but it
# never upgrades or deletes them. Schema changes therefore need an explicit
# `kubectl apply` on upgrade -- see deploy/README.md. That trade is deliberate:
# the alternative (templating it) would make `helm uninstall` delete the CRD and
# with it every AkshPolicy in the cluster, silently removing egress policy from
# every protected workload.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: akshpolicies.aksh.dev
spec:
  group: aksh.dev
  scope: Namespaced
  names:
    plural: akshpolicies
    singular: akshpolicy
    kind: AkshPolicy
    listKind: AkshPolicyList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                egress:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    rules:
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
