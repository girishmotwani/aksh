# AKS variant of test/e2e/manifests/50-aksh-pod.yaml -- the de-risk capture
# probe: proxy (uid 1774, capture-excluded) + a captured uid-0 workload that
# loops allowed.test (ALLOW->200) and blocked.test (BLOCK->403).
#
# Differences from the kind harness (all because AKS Ubuntu 24.04 nodes are a
# PURE cgroup-v2 host, unlike kind's hybrid v1/v2 image):
#   * images come from ACR (${ACR}) with IfNotPresent, not a kind-loaded local tag.
#   * cgroup paths point at the node's real unified hierarchy at /sys/fs/cgroup
#     (bind-mounted to /host/sys/fs/cgroup) for BOTH the capture target (P4) and
#     the proxy's own cgroup (P3) -- there is no separate `unified/` subdir here.
#   * MOUNT_BPFFS stays true: a pod still sees /sys/fs/bpf as fresh sysfs, so the
#     proxy mounts its own per-pod bpffs with the CAP_SYS_ADMIN it holds.
#   * UP points at the AKS-CIDR echo clusterIP (10.0.100.100).
# ${ACR} is substituted by run.ps1 before apply.
apiVersion: v1
kind: Pod
metadata:
  name: aksh-e2e
  namespace: aksh-e2e
  annotations:
    aksh.dev/injected: v1
  labels: { app: aksh-e2e }
spec:
  serviceAccountName: aksh-proxy
  hostPID: true
  restartPolicy: Never
  securityContext:
    fsGroup: 1774
  volumes:
    - name: hostcgroup
      hostPath: { path: /sys/fs/cgroup }
    - name: podinfo
      downwardAPI:
        items:
          - { path: labels, fieldRef: { fieldPath: metadata.labels } }
    - name: ca-priv
      emptyDir: {}
    - name: ca-pub
      emptyDir: {}
    - name: entra-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: api://AzureADTokenExchange
              expirationSeconds: 3600
    - name: upstream-ca
      configMap:
        name: upstream-ca
  containers:
    - name: aksh
      image: ${ACR}/aksh-proxy:soak
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 1774
        runAsGroup: 1774
        # AKS Ubuntu nodes enforce the default containerd AppArmor profile,
        # which denies mount(2) even with CAP_SYS_ADMIN. The proxy mounts its
        # own per-pod bpffs at /sys/fs/bpf (P6), so it must run Unconfined.
        # (kind does not load AppArmor, which is why this is AKS-only.)
        appArmorProfile:
          type: Unconfined
        capabilities:
          add: ["BPF", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_RESOURCE", "PERFMON", "SETGID", "SETUID", "SETPCAP"]
      env:
        - name: POD_IP
          valueFrom: { fieldRef: { fieldPath: status.podIP } }
        - name: AKSH_POD_NAMESPACE
          valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
        - name: AKSH_POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: AKSH_POD_UID
          valueFrom: { fieldRef: { fieldPath: metadata.uid } }
        - name: AKSH_AGENT_SERVICE_ACCOUNT
          valueFrom: { fieldRef: { fieldPath: spec.serviceAccountName } }
        - { name: AKSH_POLICY_NAMESPACE, value: "aksh-e2e" }
        - { name: AKSH_SA_TOKEN_PATH, value: "/var/run/secrets/aksh/token" }
        - { name: AKSH_ENTRA_TENANT_ID, value: "11111111-1111-1111-1111-111111111111" }
        - { name: AKSH_ENTRA_CLIENT_ID, value: "22222222-2222-2222-2222-222222222222" }
        - { name: AKSH_ENTRA_AUTHORITY, value: "https://login.microsoftonline.com/11111111-1111-1111-1111-111111111111" }
        - { name: AKSH_AUDIT_SINK, value: "stdout" }
        - { name: AKSH_CA_PRIV_DIR, value: "/var/lib/aksh/ca-priv" }
        - { name: AKSH_CA_PUB_DIR, value: "/var/lib/aksh/ca-pub" }
        # Pure cgroup-v2 node: the unified hierarchy IS /sys/fs/cgroup, bound in
        # at /host/sys/fs/cgroup for the capture-target walk (P4/host mount).
        # The proxy's OWN cgroup mount is the container-local /sys/fs/cgroup,
        # which under a private cgroup namespace is rooted at this pod's own
        # cgroup dir -- its inode is what Case-B discovery matches against the
        # host tree to recover the (unnameable "0::/") pod cgroup path.
        - { name: AKSH_CAPTURE_HOST_CGROUP_MOUNT, value: "/host/sys/fs/cgroup" }
        - { name: AKSH_CAPTURE_LOCAL_CGROUP_MOUNT, value: "/sys/fs/cgroup" }
        - { name: AKSH_CAPTURE_MOUNT_BPFFS, value: "true" }
        - { name: AKSH_CAPTURE_PROXY_UID, value: "1774" }
        - { name: AKSH_CAPTURE_PROXY_GID, value: "1774" }
        - { name: AKSH_CAPTURE_BLOCK_NON_TCP, value: "true" }
        - { name: AKSH_CAPTURE_RUN_PROBE, value: "true" }
        - { name: AKSH_POLICY_FIRST_SNAPSHOT_TIMEOUT, value: "300s" }
      command:
        - /usr/local/bin/aksh-proxy
      volumeMounts:
        - { name: hostcgroup, mountPath: /host/sys/fs/cgroup }
        - { name: ca-priv, mountPath: /var/lib/aksh/ca-priv }
        - { name: ca-pub, mountPath: /var/lib/aksh/ca-pub }
        - { name: entra-token, mountPath: /var/run/secrets/aksh, readOnly: true }
        - { name: upstream-ca, mountPath: /etc/aksh/upstream-ca, readOnly: true }
        - { name: podinfo, mountPath: /etc/aksh/podinfo, readOnly: true }
    - name: workload
      image: ${ACR}/aksh-proxy:soak
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          echo "[workload] starting egress driver (http1.1) as uid $(id -u)"
          UP=10.0.100.100
          probe() {
            curl -sk --http1.1 -m 4 -w ' CODE=%{http_code} VIA=%{remote_ip}' \
              --resolve "$1:8443:$UP" "https://$1:8443/" 2>/dev/null
          }
          while true; do
            A=$(probe allowed.test); echo "[workload] ALLOW -> $A"
            B=$(probe blocked.test); echo "[workload] BLOCK -> $B"
            sleep 2
          done
