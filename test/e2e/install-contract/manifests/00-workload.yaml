# Workload fixtures for the install-contract harness.
#
# IMPORTANT: this file may contain ONLY things an operator writes themselves --
# their namespace, their pod, their policy. It must never contain aksh install
# artifacts (the CRD, the sidecar's Role/RoleBinding, the webhook configs).
# Those must come from deploy/, which is the entire point of this harness.
# run.ps1 asserts this mechanically before installing anything.
apiVersion: v1
kind: Namespace
metadata:
  name: aksh-install
---
# A completely plain pod. No sidecar, no volumes, no securityContext -- exactly
# what an operator would already have running. The mutating webhook is expected
# to turn this into a protected pod on its own.
apiVersion: v1
kind: Pod
metadata:
  name: install-target
  namespace: aksh-install
  labels: { app: install-target }
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: aksh-proxy:latest
      imagePullPolicy: Never
      command: ["/bin/sh", "-c", "sleep 3600"]
