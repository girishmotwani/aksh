# The pod the test actually drives: a real kagent agent container with an aksh
# sidecar in front of it.
#
# WHY THIS IS A HAND-WRITTEN DEPLOYMENT AND NOT spec.declarative.deployment
#
# The Agent CRD (v1alpha2) exposes extraContainers, volumes, volumeMounts, env
# and securityContext -- but not hostPID. aksh needs hostPID because preflight
# gate V6 (capture/cgroup.go:validateProxyPresence) proves the resolved cgroup
# really contains the proxy by looking for os.Getpid() in a descendant
# cgroup.procs. Those files list HOST pids, so without hostPID the proxy
# compares its namespaced pid against host pids and never matches.
#
# Patching hostPID onto the controller-generated Deployment does not work: the
# kagent controller owns that object and reconciles the field away. Measured --
# the patch is accepted, the Deployment generation increments, and the field is
# gone from the next read.
#
# So the Agent CR in 70-agent-aksh.yaml exists to make the controller generate
# the agent's real configuration (Secret aksh-agent), and this Deployment runs
# that same configuration in a pod we own. The agent container is the unmodified
# kagent image with the controller's own config and its own ServiceAccount
# token, so what is under test is a real kagent agent -- only the pod wrapper is
# ours. The labels deliberately differ from app=kagent so the controller's
# Service does not select these pods; the driver addresses the agent by pod IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aksh-agent-shim
  namespace: kagent
  labels: { app: aksh-kagent-e2e }
spec:
  replicas: 1
  selector:
    matchLabels: { app: aksh-kagent-e2e }
  template:
    metadata:
      labels: { app: aksh-kagent-e2e }
    spec:
      serviceAccountName: aksh-kagent
      hostPID: true
      securityContext:
        fsGroup: 1774
      volumes:
        # --- agent-side ---
        - name: config
          secret:
            secretName: aksh-agent          # generated by the controller from the Agent CR
        - name: aksh-pod-ca
          secret:
            secretName: aksh-pod-ca
            items:
              - { key: ca-cert.pem, path: ca-cert.pem }
        - name: kagent-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: kagent
                  expirationSeconds: 3600
                  path: kagent-token
        # --- proxy-side ---
        - name: hostcgroup
          hostPath: { path: /sys/fs/cgroup }
        - name: podinfo
          downwardAPI:
            items:
              - { path: labels, fieldRef: { fieldPath: metadata.labels } }
        # The pod CA is pre-seeded rather than generated at run time so the agent
        # container's trust file exists before it starts. pki/provider.go loads
        # existing material when both key and cert are present, and verifies the
        # public copy matches, which is why both mounts come from one secret.
        - name: ca-priv
          secret:
            secretName: aksh-pod-ca
            defaultMode: 0400
        - name: ca-pub
          secret:
            secretName: aksh-pod-ca
            items:
              - { key: ca-cert.pem, path: ca-cert.pem }
        - name: mockllm-ca
          secret:
            secretName: mockllm-ca
        - name: entra-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api://AzureADTokenExchange
                  expirationSeconds: 3600
                  path: token
      containers:
        # -------------------------------------------------------------------
        # The agent under test. Copied field-for-field from the Deployment the
        # kagent controller generates, except that the CA volume is the aksh pod
        # CA (see 60-modelconfig-aksh.yaml) and there is no readinessProbe --
        # readiness is asserted by the driver instead, since this pod is not
        # behind the controller's Service.
        # -------------------------------------------------------------------
        - name: kagent
          image: cr.kagent.dev/kagent-dev/kagent/app:0.9.12
          imagePullPolicy: IfNotPresent
          args: ["--host", "0.0.0.0", "--port", "8080", "--filepath", "/config"]
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          env:
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: kagent-openai, key: OPENAI_API_KEY } }
            - { name: OTEL_LOGGING_ENABLED, value: "false" }
            - { name: OTEL_TRACING_ENABLED, value: "false" }
            - name: KAGENT_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: KAGENT_NAME, value: "aksh-agent" }
            # Plaintext, in-cluster, and mandatory -- this is the traffic that
            # issue #80 is about. It is covered by AKSH_CAPTURE_BYPASS_CIDRS.
            - { name: KAGENT_URL, value: "http://kagent-controller.kagent:8083" }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: aksh-pod-ca, mountPath: /etc/ssl/certs/custom/aksh-pod-ca, readOnly: true }
            - { name: kagent-token, mountPath: /var/run/secrets/tokens }
        # -------------------------------------------------------------------
        # The proxy. Shape and rationale mirror test/e2e/manifests/50-aksh-pod.yaml;
        # only the namespace, the CA source and the bypass list differ.
        # -------------------------------------------------------------------
        - name: aksh
          image: aksh-proxy:e2e
          imagePullPolicy: Never
          securityContext:
            runAsUser: 1774
            runAsGroup: 1774
            capabilities:
              add: ["BPF", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_RESOURCE", "PERFMON", "SETGID", "SETUID", "SETPCAP"]
          env:
            # The control-plane bind host is reconciled from the pod IP at wire
            # time and loopback is rejected, so this is mandatory.
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: AKSH_POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: AKSH_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: AKSH_POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: AKSH_AGENT_SERVICE_ACCOUNT
              valueFrom: { fieldRef: { fieldPath: spec.serviceAccountName } }
            - { name: AKSH_POLICY_NAMESPACE, value: "kagent" }
            - { name: AKSH_SA_TOKEN_PATH, value: "/var/run/secrets/aksh/token" }
            - { name: AKSH_ENTRA_TENANT_ID, value: "11111111-1111-1111-1111-111111111111" }
            - { name: AKSH_ENTRA_CLIENT_ID, value: "22222222-2222-2222-2222-222222222222" }
            - { name: AKSH_ENTRA_AUTHORITY, value: "https://login.microsoftonline.com/11111111-1111-1111-1111-111111111111" }
            - { name: AKSH_AUDIT_SINK, value: "stdout" }
            - { name: AKSH_CA_PRIV_DIR, value: "/var/lib/aksh/ca-priv" }
            - { name: AKSH_CA_PUB_DIR, value: "/var/lib/aksh/ca-pub" }
            - { name: AKSH_CAPTURE_HOST_CGROUP_MOUNT, value: "/host/sys/fs/cgroup/unified" }
            - { name: AKSH_CAPTURE_LOCAL_CGROUP_MOUNT, value: "/host/sys/fs/cgroup/unified" }
            - { name: AKSH_CAPTURE_MOUNT_BPFFS, value: "true" }
            - { name: AKSH_CAPTURE_PROXY_UID, value: "1774" }
            - { name: AKSH_CAPTURE_PROXY_GID, value: "1774" }
            - { name: AKSH_CAPTURE_BLOCK_NON_TCP, value: "true" }
            - { name: AKSH_CAPTURE_RUN_PROBE, value: "true" }
            - { name: AKSH_POLICY_FIRST_SNAPSHOT_TIMEOUT, value: "300s" }
            # Both values are cluster-assigned, so run.ps1 reads them from the
            # live cluster and writes this ConfigMap. Hard-coding them would be
            # a lie that happens to be true on one kind cluster.
            - name: AKSH_CAPTURE_DNS_SERVER
              valueFrom: { configMapKeyRef: { name: aksh-kagent-net, key: dnsServer } }
            - name: AKSH_CAPTURE_BYPASS_CIDRS
              valueFrom: { configMapKeyRef: { name: aksh-kagent-net, key: bypassCIDRs } }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              V2=$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup)
              POD=$(dirname "$V2")
              export AKSH_CAPTURE_POD_PATH="/host/sys/fs/cgroup/unified${POD}"
              echo "[wrapper] AKSH_CAPTURE_POD_PATH=$AKSH_CAPTURE_POD_PATH"
              # The proxy relays to the real upstream (the mock serving
              # api.openai.com) over TLS using system roots, so its trust store
              # needs the mock's throwaway CA appended.
              cat /etc/ssl/certs/ca-certificates.crt /etc/aksh/mockllm-ca/ca.crt > /tmp/ca-bundle.crt
              export SSL_CERT_FILE=/tmp/ca-bundle.crt
              echo "[wrapper] bypass=$AKSH_CAPTURE_BYPASS_CIDRS dns=$AKSH_CAPTURE_DNS_SERVER"
              exec /usr/local/bin/aksh-proxy
          volumeMounts:
            - { name: hostcgroup, mountPath: /host/sys/fs/cgroup }
            - { name: ca-priv, mountPath: /var/lib/aksh/ca-priv, readOnly: true }
            - { name: ca-pub, mountPath: /var/lib/aksh/ca-pub, readOnly: true }
            - { name: mockllm-ca, mountPath: /etc/aksh/mockllm-ca, readOnly: true }
            - { name: entra-token, mountPath: /var/run/secrets/aksh, readOnly: true }
            - { name: podinfo, mountPath: /etc/aksh/podinfo, readOnly: true }
        # -------------------------------------------------------------------
        # Traffic driver. Two jobs, both required:
        #
        #  1. Keep captured traffic flowing. The orchestrator's Phase-B accept
        #     probe (runtime/orchestrator.go, acceptProbeTimeout = 5s) waits for
        #     a redirected connection and terminates the proxy if none arrives.
        #     A kagent agent only dials its model when someone asks it a
        #     question, and it is not even ready for ~15s, so something must
        #     produce captured egress from the first second.
        #  2. Exercise the deny leg. blocked.test matches no AkshPolicy rule, so
        #     it must come back as a uniform deny rather than being relayed.
        #
        # It runs as uid 0, i.e. it IS captured, unlike the proxy (uid 1774).
        # -------------------------------------------------------------------
        - name: driver
          image: aksh-proxy:e2e
          imagePullPolicy: Never
          env:
            # blocked.test has no DNS record, and api.openai.com is only
            # resolvable through the CoreDNS rewrite; --resolve pins both to the
            # mock's ClusterIP so the driver's connects reach a captured
            # destination and differ only in the SNI they present, which is
            # exactly what the policy matches on.
            - name: UPSTREAM_IP
              valueFrom: { configMapKeyRef: { name: aksh-kagent-net, key: upstreamIP } }
          command:
            - /bin/sh
            - -c
            - |
              echo "[driver] starting as uid $(id -u), upstream $UPSTREAM_IP"
              probe() {
                curl -sk --http1.1 -m 4 -o /dev/null \
                  --resolve "$1:443:$UPSTREAM_IP" \
                  -w "$1 CODE=%{http_code} VIA=%{remote_ip}" "https://$1/" 2>/dev/null
              }
              while true; do
                echo "[driver] ALLOW -> $(probe api.openai.com)"
                echo "[driver] BLOCK -> $(probe blocked.test)"
                sleep 2
              done
