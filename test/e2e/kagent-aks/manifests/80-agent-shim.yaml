# The pod the test actually drives on AKS: a real kagent agent container with an
# aksh sidecar in front of it. This is the AKS variant of
# test/e2e/kagent/manifests/80-agent-shim.yaml -- the agent, driver, volumes and
# assertions are identical; only the three things a real (cgroup-namespaced,
# AppArmor-enforcing, registry-pulling) node forces are different, and they are
# called out inline with an "AKS:" marker.
#
# WHY A HAND-WRITTEN DEPLOYMENT AND NOT spec.declarative.deployment
#
# The Agent CRD (v1alpha2) exposes extraContainers, volumes, volumeMounts, env
# and securityContext -- but not hostPID. aksh needs hostPID because preflight
# gate V6 (capture/cgroup.go:validateProxyPresence) proves the resolved cgroup
# really contains the proxy by looking for os.Getpid() in a descendant
# cgroup.procs, and those files list HOST pids. Patching hostPID onto the
# controller-generated Deployment does not stick: the kagent controller owns
# that object and reconciles the field away. So the Agent CR in 70-agent-aksh
# makes the controller generate the real config (Secret aksh-agent) and this
# Deployment runs that same config in a pod we own. run.ps1 substitutes
# ${ACR} and ${TAG}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aksh-agent-shim
  namespace: kagent
  labels: { app: aksh-kagent-e2e }
spec:
  replicas: 1
  selector:
    matchLabels: { app: aksh-kagent-e2e }
  template:
    metadata:
      labels: { app: aksh-kagent-e2e }
    spec:
      serviceAccountName: aksh-kagent
      hostPID: true
      securityContext:
        fsGroup: 1774
      volumes:
        # --- agent-side ---
        - name: config
          secret:
            secretName: aksh-agent          # generated by the controller from the Agent CR
        - name: aksh-pod-ca
          secret:
            secretName: aksh-pod-ca
            items:
              - { key: ca-cert.pem, path: ca-cert.pem }
        - name: kagent-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: kagent
                  expirationSeconds: 3600
                  path: kagent-token
        # --- proxy-side ---
        - name: hostcgroup
          hostPath: { path: /sys/fs/cgroup }
        - name: podinfo
          downwardAPI:
            items:
              - { path: labels, fieldRef: { fieldPath: metadata.labels } }
        - name: ca-priv
          secret:
            secretName: aksh-pod-ca
            defaultMode: 0400
        - name: ca-pub
          secret:
            secretName: aksh-pod-ca
            items:
              - { key: ca-cert.pem, path: ca-cert.pem }
        - name: mockllm-ca
          secret:
            secretName: mockllm-ca
        - name: entra-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api://AzureADTokenExchange
                  expirationSeconds: 3600
                  path: token
      containers:
        # -------------------------------------------------------------------
        # The agent under test. Unmodified kagent image + the controller's own
        # generated config; only the CA volume is the aksh pod CA and there is
        # no readinessProbe (readiness is asserted by the driver). Its image is
        # public (cr.kagent.dev), so it is pulled directly on AKS -- unchanged
        # from the kind harness.
        # -------------------------------------------------------------------
        - name: kagent
          image: cr.kagent.dev/kagent-dev/kagent/app:0.9.12
          imagePullPolicy: IfNotPresent
          args: ["--host", "0.0.0.0", "--port", "8080", "--filepath", "/config"]
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          env:
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: kagent-openai, key: OPENAI_API_KEY } }
            - { name: OTEL_LOGGING_ENABLED, value: "false" }
            - { name: OTEL_TRACING_ENABLED, value: "false" }
            - name: KAGENT_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: KAGENT_NAME, value: "aksh-agent" }
            # Plaintext, in-cluster, and mandatory -- this is the traffic that
            # issue #80 is about. It is covered by AKSH_CAPTURE_BYPASS_CIDRS.
            - { name: KAGENT_URL, value: "http://kagent-controller.kagent:8083" }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: aksh-pod-ca, mountPath: /etc/ssl/certs/custom/aksh-pod-ca, readOnly: true }
            - { name: kagent-token, mountPath: /var/run/secrets/tokens }
        # -------------------------------------------------------------------
        # The proxy. Shape mirrors the kind shim; the AKS: markers are the only
        # differences from test/e2e/kagent/manifests/80-agent-shim.yaml.
        # -------------------------------------------------------------------
        - name: aksh
          # AKS: pulled from the cluster's ACR (there is no `kind load`).
          image: ${ACR}/aksh-proxy:${TAG}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1774
            runAsGroup: 1774
            # AKS: the node enforces the default containerd AppArmor profile,
            # which denies mount(2) even with CAP_SYS_ADMIN and blocks the
            # per-pod bpffs mount. kind does not enforce AppArmor.
            appArmorProfile:
              type: Unconfined
            capabilities:
              add: ["BPF", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_RESOURCE", "PERFMON", "SETGID", "SETUID", "SETPCAP"]
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: AKSH_POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: AKSH_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: AKSH_POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: AKSH_AGENT_SERVICE_ACCOUNT
              valueFrom: { fieldRef: { fieldPath: spec.serviceAccountName } }
            - { name: AKSH_POLICY_NAMESPACE, value: "kagent" }
            - { name: AKSH_SA_TOKEN_PATH, value: "/var/run/secrets/aksh/token" }
            - { name: AKSH_ENTRA_TENANT_ID, value: "11111111-1111-1111-1111-111111111111" }
            - { name: AKSH_ENTRA_CLIENT_ID, value: "22222222-2222-2222-2222-222222222222" }
            - { name: AKSH_ENTRA_AUTHORITY, value: "https://login.microsoftonline.com/11111111-1111-1111-1111-111111111111" }
            - { name: AKSH_AUDIT_SINK, value: "stdout" }
            - { name: AKSH_CA_PRIV_DIR, value: "/var/lib/aksh/ca-priv" }
            - { name: AKSH_CA_PUB_DIR, value: "/var/lib/aksh/ca-pub" }
            # AKS: on a cgroup-namespaced node /proc/self/cgroup reads 0::/ and
            # the Case-A path cannot derive the pod cgroup, so the proxy falls
            # back to inode-based discovery (DiscoverPodCgroup) anchored on the
            # container's OWN namespaced cgroup mount -- which is why LOCAL is
            # /sys/fs/cgroup (the container's real cgroupfs), not the host bind.
            # No AKSH_CAPTURE_POD_PATH wrapper is needed: Case-B discovers it.
            - { name: AKSH_CAPTURE_HOST_CGROUP_MOUNT, value: "/host/sys/fs/cgroup" }
            - { name: AKSH_CAPTURE_LOCAL_CGROUP_MOUNT, value: "/sys/fs/cgroup" }
            - { name: AKSH_CAPTURE_MOUNT_BPFFS, value: "true" }
            - { name: AKSH_CAPTURE_PROXY_UID, value: "1774" }
            - { name: AKSH_CAPTURE_PROXY_GID, value: "1774" }
            - { name: AKSH_CAPTURE_BLOCK_NON_TCP, value: "true" }
            - { name: AKSH_CAPTURE_RUN_PROBE, value: "true" }
            - { name: AKSH_POLICY_FIRST_SNAPSHOT_TIMEOUT, value: "300s" }
            # Both values are cluster-assigned, so run.ps1 reads them from the
            # live cluster and writes this ConfigMap.
            - name: AKSH_CAPTURE_DNS_SERVER
              valueFrom: { configMapKeyRef: { name: aksh-kagent-net, key: dnsServer } }
            - name: AKSH_CAPTURE_BYPASS_CIDRS
              valueFrom: { configMapKeyRef: { name: aksh-kagent-net, key: bypassCIDRs } }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # The proxy relays to the real upstream (the mock serving
              # api.openai.com) over TLS using system roots, so its trust store
              # needs the mock's throwaway CA appended.
              cat /etc/ssl/certs/ca-certificates.crt /etc/aksh/mockllm-ca/ca.crt > /tmp/ca-bundle.crt
              export SSL_CERT_FILE=/tmp/ca-bundle.crt
              echo "[wrapper] bypass=$AKSH_CAPTURE_BYPASS_CIDRS dns=$AKSH_CAPTURE_DNS_SERVER"
              exec /usr/local/bin/aksh-proxy
          volumeMounts:
            - { name: hostcgroup, mountPath: /host/sys/fs/cgroup }
            - { name: ca-priv, mountPath: /var/lib/aksh/ca-priv, readOnly: true }
            - { name: ca-pub, mountPath: /var/lib/aksh/ca-pub, readOnly: true }
            - { name: mockllm-ca, mountPath: /etc/aksh/mockllm-ca, readOnly: true }
            - { name: entra-token, mountPath: /var/run/secrets/aksh, readOnly: true }
            - { name: podinfo, mountPath: /etc/aksh/podinfo, readOnly: true }
        # -------------------------------------------------------------------
        # Traffic driver (uid 0, IS captured). Keeps the orchestrator's 5s
        # accept probe fed and exercises the deny leg (blocked.test). Its image
        # is the aksh image (it has curl); AKS: pulled from the ACR.
        # -------------------------------------------------------------------
        - name: driver
          image: ${ACR}/aksh-proxy:${TAG}
          imagePullPolicy: IfNotPresent
          env:
            - name: UPSTREAM_IP
              valueFrom: { configMapKeyRef: { name: aksh-kagent-net, key: upstreamIP } }
          command:
            - /bin/sh
            - -c
            - |
              echo "[driver] starting as uid $(id -u), upstream $UPSTREAM_IP"
              probe() {
                curl -sk --http1.1 -m 4 -o /dev/null \
                  --resolve "$1:443:$UPSTREAM_IP" \
                  -w "$1 CODE=%{http_code} VIA=%{remote_ip}" "https://$1/" 2>/dev/null
              }
              while true; do
                echo "[driver] ALLOW -> $(probe api.openai.com)"
                echo "[driver] BLOCK -> $(probe blocked.test)"
                sleep 2
              done
