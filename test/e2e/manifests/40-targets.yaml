apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-upstream
  namespace: aksh-e2e
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo-upstream }
  template:
    metadata:
      labels: { app: echo-upstream }
    spec:
      containers:
        - name: echo
          image: echo:e2e
          imagePullPolicy: Never
          env:
            - { name: ECHO_LISTEN, value: ":8443" }
            - { name: ECHO_MSG, value: "ALLOWED-UPSTREAM-OK" }
          ports:
            - containerPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: echo-upstream
  namespace: aksh-e2e
spec:
  clusterIP: 10.96.100.100          # fixed so the workload can --resolve to it and the proxy recovers a stable original-dst
  selector: { app: echo-upstream }
  ports:
    - name: https
      port: 8443
      targetPort: 8443
