# aksh-proxy identity + least-privilege RBAC: read-only get/list/watch on
# akshpolicies in its OWN namespace only (matches the own-namespace-only
# fail-closed invariant in internal/policy/watch/client.go).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aksh-proxy
  namespace: aksh-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aksh-proxy-policy-reader
  namespace: aksh-e2e
rules:
  - apiGroups: ["aksh.dev"]
    resources: ["akshpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aksh-proxy-policy-reader
  namespace: aksh-e2e
subjects:
  - kind: ServiceAccount
    name: aksh-proxy
    namespace: aksh-e2e
roleRef:
  kind: Role
  name: aksh-proxy-policy-reader
  apiGroup: rbac.authorization.k8s.io
