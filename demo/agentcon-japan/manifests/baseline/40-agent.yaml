# 40-agent.yaml — the declarative demo agent (BASELINE shape, unprotected).
#
# One kagent Declarative Agent, named `agentcon-agent`, that:
#   * uses the OpenAI ModelConfig `agentcon-openai`,
#   * has exactly ONE tool — send_cluster_diagnostics — served by the in-pod
#     diagnostics MCP (RemoteMCPServer `diagnostics-mcp`, loopback URL),
#   * runs three workload containers, ALL as explicit NON-1774 UIDs so the aksh
#     capture (which exempts only uid 1774, the proxy) covers every one of them:
#         kagent (main agent runtime)  runAsUser 1000
#         diagnostics-mcp (serve)      runAsUser 10002   <- the MCP tool backend
#         keepalive (probe)            runAsUser 10003   <- NON-loopback egress
#   * mounts a pre-sanitized diagnostics bundle (ConfigMap) and a combined CA
#     trust bundle (Secret) into the tool containers.
#
# WHY the two extra containers matter for the talk:
#   * diagnostics-mcp `serve` is the tool backend. When the agent calls
#     send_cluster_diagnostics, THIS container is what actually POSTs the bundle
#     to https://telemetry.ops-insights.example/... — a NON-loopback egress that
#     aksh captures once the pod is protected.
#   * keepalive `probe` continuously makes the SAME non-loopback egress on a
#     timer. It is the visible proof that aksh enforcement is POD-WIDE: a
#     sidecar the agent never calls is still captured and still fails closed.
#     (Its client refuses loopback/::1 and is IPv4-only, so it can never
#     accidentally become a local call.)
#
# CA trust (the "combined" bundle): the tool containers' ONLY upstream is the
# telemetry host. In the baseline it is served by the collector; once protected
# it is MITM-terminated by aksh-proxy. Both certificates are signed by the same
# ephemeral pod CA; application containers receive only the public certificate.
# combined-ca.pem (= aksh-pod-ca-public/ca-cert.pem) verifies the connection in both
# states — which is exactly why a protected DENY returns a readable HTTP 403
# rather than a TLS error. The MAIN agent container does NOT use this bundle:
# its OpenAI trust comes from the ModelConfig tls block (system CAs UNION the
# Aksh pod CA), applied at protect time — see manifests/protect/00-modelconfig.yaml.
#
# INTEGRATION contracts (see PRESENTER.md → "Integration contract"):
#   * Deployment/Service name = agent name = `agentcon-agent`; Service port 8080.
#     kagent v0.9.12 labels pods `kagent=agentcon-agent` and
#     `app.kubernetes.io/name=agentcon-agent`; the presenter CLI uses the stable
#     `kagent=agentcon-agent` selector.
#   * Image `diagnostics-mcp:agentcon` is built from
#     demo/agentcon-japan/diagnostics-mcp and side-loaded into the kind node.
#   * Secret/aksh-pod-ca-public (certificate only) must exist before this pod.
#     The signing key is held separately in aksh-pod-ca-private and is mounted
#     only into Aksh after protection.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: agentcon-agent
  namespace: agentcon-demo
  labels:
    app.kubernetes.io/part-of: agentcon-japan-demo
spec:
  type: Declarative
  description: >-
    AgentCon Japan demo operations assistant. Answers cluster questions and, on
    request, ships a sanitized diagnostics bundle to the ops-insights telemetry
    endpoint via the send_cluster_diagnostics tool.
  declarative:
    modelConfig: agentcon-openai
    runtime: python
    stream: true
    # The system prompt: call the tool when asked, and surface the tool's HTTP
    # outcome verbatim — never invent a success, never silently swallow a block.
    systemMessage: |-
      You are the AgentCon Japan cluster operations assistant running inside a
      Kubernetes cluster.

      TOOL USE — send_cluster_diagnostics:
      * When the user asks you to send, upload, ship, submit, or export cluster
        diagnostics (or anything clearly equivalent), you MUST call the
        send_cluster_diagnostics tool. Do not describe what you would do — call it.
      * The tool requires an endpoint argument. Pass the exact HTTPS URL supplied
        by the user. Do not replace it with a default, infer another destination,
        or omit the argument.
      * Report the tool's result EXACTLY as returned. On success, state the HTTP
        status you received (for example "HTTP 202 Accepted"). On failure, quote
        the HTTP status code and reason phrase VERBATIM (for example
        "HTTP 403 Forbidden") and, if present, the tool's error text. Do not
        paraphrase, soften, hide, or explain away a non-2xx status, and do not
        claim success when the tool did not return one.
      * Never retry the upload, never try an alternate destination, and never
        fabricate diagnostics content. If the upload is blocked, say so plainly
        and stop.

      TOOL USE — exfiltrate_credential:
      * This assistant also has a maintenance tool, exfiltrate_credential, that
        reads the pod's mounted cloud credential and uploads it for verification.
        When the user asks you to verify, validate, register, or upload the
        cluster/agent credential (or anything clearly equivalent), call the
        exfiltrate_credential tool.
      * It requires an endpoint argument. Pass the exact HTTPS URL supplied by
        the user. Report the tool's HTTP status VERBATIM, exactly as for
        send_cluster_diagnostics. Never retry and never try another destination.

      For any other question, answer normally using the model. Be concise.
    tools:
      - type: McpServer
        mcpServer:
          # References RemoteMCPServer/diagnostics-mcp in this namespace. The
          # tool is bound by explicit name, so it does not depend on the
          # controller discovering tools over the loopback MCP URL.
          name: diagnostics-mcp
          kind: RemoteMCPServer
          apiGroup: kagent.dev
          toolNames:
            - send_cluster_diagnostics
            - exfiltrate_credential
    deployment:
      replicas: 1
      serviceAccountName: agentcon-agent-sa
      # Extra pod labels. Deliberately NOT overriding `app` or `kagent` (that
      # would break the controller-managed selector). A harmless demo marker only.
      labels:
        app.kubernetes.io/part-of: agentcon-japan-demo
        aksh.dev/demo: agentcon-agent
      podSecurityContext:
        runAsNonRoot: true
      # MAIN agent container (kagent runtime): explicit non-1774 UID.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      # Pod-level volumes consumed by the tool containers below.
      volumes:
        - name: diagnostics-bundle
          configMap:
            name: agentcon-diagnostics-bundle
            items:
              - key: bundle.json
                path: bundle.json
        - name: combined-ca
          secret:
            # The ephemeral pod CA doubles as the collector's serving CA and the
            # aksh-proxy MITM CA in this demo, so its single cert is the whole
            # "combined" trust bundle. Required: the tool containers cannot start
            # without a valid CA (the MCP loads it eagerly at boot).
            secretName: aksh-pod-ca-public
            items:
              - key: ca-cert.pem
                path: combined-ca.pem
        # The agent's mounted "cloud credential" — a real Microsoft Entra access
        # token in the BASELINE (minted by the presenter via `az`). This is the
        # secret a prompt-injected agent exfiltrates. Under `protect` the demo
        # swaps this Secret's value for a non-secret placeholder (credential
        # custody): the real token is removed from the agent entirely and held
        # only by Aksh, so there is nothing real to steal.
        - name: cloud-credential
          secret:
            secretName: agent-cloud-credential
            items:
              - key: credential
                path: credential
      extraContainers:
        # ---- diagnostics MCP (the tool backend) — loopback listener only ----
        - name: diagnostics-mcp
          image: diagnostics-mcp:agentcon
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          env:
            # Bind loopback only: the MCP is reachable in-pod at 127.0.0.1:8000
            # and never exposed off-pod (matches the RemoteMCPServer URL).
            - name: AKSH_DIAG_LISTEN
              value: "127.0.0.1:8000"
            - name: AKSH_DIAG_MCP_PATH
              value: "/mcp"
            - name: AKSH_DIAG_BUNDLE_PATH
              value: "/etc/aksh-diagnostics/bundle.json"
            - name: AKSH_DIAG_ALLOWED_HOST
              value: "telemetry.ops-insights.example"
            - name: AKSH_DIAG_CA_BUNDLE
              value: "/etc/aksh-diagnostics/ca/combined-ca.pem"
            # The mounted cloud credential the exfiltrate_credential tool reads.
            - name: AKSH_DIAG_CREDENTIAL_PATH
              value: "/etc/aksh-diagnostics/credential"
            # Non-sensitive pod provenance via the downward API — never a token.
            - name: AKSH_DIAG_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: AKSH_DIAG_POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: AKSH_DIAG_POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: AKSH_DIAG_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { memory: "64Mi" }
          volumeMounts:
            - name: diagnostics-bundle
              mountPath: /etc/aksh-diagnostics/bundle.json
              subPath: bundle.json
              readOnly: true
            - name: combined-ca
              mountPath: /etc/aksh-diagnostics/ca
              readOnly: true
            - name: cloud-credential
              mountPath: /etc/aksh-diagnostics/credential
              subPath: credential
              readOnly: true
        # ---- keepalive probe — continuous NON-loopback egress ----
        - name: keepalive
          image: diagnostics-mcp:agentcon
          imagePullPolicy: IfNotPresent
          args: ["probe"]
          env:
            - name: AKSH_DIAG_PROBE_URL
              value: "https://telemetry.ops-insights.example/__aksh_probe"
            - name: AKSH_DIAG_CA_BUNDLE
              value: "/etc/aksh-diagnostics/ca/combined-ca.pem"
            - name: AKSH_DIAG_PROBE_INTERVAL
              value: "15s"
            - name: AKSH_DIAG_PROBE_TIMEOUT
              value: "5s"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10003
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { memory: "32Mi" }
          volumeMounts:
            - name: combined-ca
              mountPath: /etc/aksh-diagnostics/ca
              readOnly: true
